services:
  rsshub:
    image: diygod/rsshub:latest
    ports:
      - "1200:1200"
    environment:
      NODE_ENV: production
      CACHE_TYPE: memory

  weibo-heat:
    build:
      context: .
      dockerfile: backend/Dockerfile.weibo
    depends_on:
      - rsshub
    environment:
      WEIBO_RSSHUB_BASE_URL: http://rsshub:1200
      WEIBO_RSSHUB_ROUTE: /weibo/search/hot
      WEIBO_RSSHUB_FETCH_LIMIT: ${WEIBO_RSSHUB_FETCH_LIMIT:-20}
      WEIBO_RSSHUB_MAX_RETRIES: ${WEIBO_RSSHUB_MAX_RETRIES:-10}
      WEIBO_RSSHUB_SKIP_TOP: ${WEIBO_RSSHUB_SKIP_TOP:-1}
      WEIBO_CLI_ENABLED: ${WEIBO_CLI_ENABLED:-false}
      WEIBO_CLI_COMMAND: weibo-cli
      WEIBO_CLI_TOPIC_LIMIT: ${WEIBO_CLI_TOPIC_LIMIT:-3}
      WEIBO_CLI_SEARCH_COUNT: ${WEIBO_CLI_SEARCH_COUNT:-5}
      WEIBO_CLI_TOKEN: ${WEIBO_CLI_TOKEN:-}
      WEIBO_CLI_REFRESH_TOKEN: ${WEIBO_CLI_REFRESH_TOKEN:-}
    volumes:
      - weibo-cli-home:/root/.weibo-cli

volumes:
  weibo-cli-home:
